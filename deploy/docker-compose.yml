x-backend: &backend
  build: ../backend
  profiles: ["app"]
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-stylist}:${POSTGRES_PASSWORD:-stylist}@postgres:5432/${POSTGRES_DB:-stylist}
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-stylist}:${RABBITMQ_PASSWORD:-stylist}@rabbitmq:5672/
    S3_ENDPOINT: http://seaweedfs:8333
    S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    S3_BUCKET: ${S3_BUCKET:-photos}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-stylist}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-stylist-secret}
    S3_REGION: ${S3_REGION:-us-east-1}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL}
    TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
    APP_ENV: ${APP_ENV:-dev}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    RECOGNIZER: ${RECOGNIZER:-gigachat}
    RECOGNIZER_FALLBACK: ${RECOGNIZER_FALLBACK:-}
    GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
    GIGACHAT_MODEL: ${GIGACHAT_MODEL:-}
    VISION_ADDR: vision:9090
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylist}
      POSTGRES_DB: ${POSTGRES_DB:-stylist}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.autoCreateBucket
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-stylist}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-stylist-secret}
    ports:
      - "${S3_PORT:-58333}:8333"
      - "${S3_FILER_PORT:-58888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stylist}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stylist}
    ports:
      - "${RABBITMQ_PORT:-55672}:5672"
      - "${RABBITMQ_UI_PORT:-55673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build: ../backend
    profiles: ["app"]
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stylist}:${POSTGRES_PASSWORD:-stylist}@postgres:5432/${POSTGRES_DB:-stylist}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *backend
    command: ["bot"]
    ports:
      - "${BOT_PORT:-52000}:2000"

  scheduler:
    <<: *backend
    command: ["scheduler"]

  sender:
    <<: *backend
    command: ["sender"]

  frontend:
    build: ../frontend
    profiles: ["app"]
    environment:
      VITE_BACKEND_URL: http://bot:2000
      VITE_STORAGE_URL: http://seaweedfs:8333
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - bot

  # Своя модель нужна, только когда RECOGNIZER или RECOGNIZER_FALLBACK - vision: make vision.
  vision:
    build: ../vision
    profiles: ["vision"]
    ports:
      - "${VISION_PORT:-59090}:9090"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  postgres-data:
  seaweedfs-data:
  rabbitmq-data:
