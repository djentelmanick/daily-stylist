services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylist}
      POSTGRES_DB: ${POSTGRES_DB:-stylist}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.autoCreateBucket
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-stylist}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-stylist-secret}
    ports:
      - "${S3_PORT:-58333}:8333"
      - "${S3_FILER_PORT:-58888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stylist}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stylist}
    ports:
      - "${RABBITMQ_PORT:-55672}:5672"
      - "${RABBITMQ_UI_PORT:-55673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Своя модель нужна, только когда RECOGNIZER или RECOGNIZER_FALLBACK - vision.
  # Тогда: docker compose --profile vision up -d --wait vision
  vision:
    build: ../vision
    profiles: ["vision"]
    ports:
      - "${VISION_PORT:-59090}:9090"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  postgres-data:
  seaweedfs-data:
  rabbitmq-data:
