services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stylist}
      POSTGRES_DB: ${POSTGRES_DB:-stylist}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.autoCreateBucket
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-stylist}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-stylist-secret}
    ports:
      - "${S3_PORT:-58333}:8333"
      - "${S3_FILER_PORT:-58888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  seaweedfs-data:
