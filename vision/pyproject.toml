[project]
name = "daily-stylist-vision"
version = "0.1.0"
description = "Распознавание одежды на фотографии для Daily Stylist"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "protobuf>=5.28",
    "pillow>=11.0",
    "numpy>=2.1",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
# Нужен только при сборке образа, чтобы посчитать эмбеддинги подписей.
export = [
    "tokenizers>=0.20",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "grpcio-tools>=1.68",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
# Сгенерированный по контракту код не наш, править его нечем.
exclude = ["app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
